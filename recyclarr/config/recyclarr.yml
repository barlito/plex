# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Language CF scores add up when a title carries several tags (VFF.VFQ,
# FRENCH.VFF, MULTi.VFF.VFQ...). MULTi is therefore set above the sum of every
# VF score that can co-occur (FR HD-UHD) or VF penalty (FR Anime), and
# until_score equals the MULTi score.

radarr:
    movies:
        base_url: http://radarr:7878
        api_key: !secret radarr_api_key
        delete_old_custom_formats: false

        quality_definition:
            type: movie
            qualities:
                - { name: WEBDL-2160p, max: 125, preferred: 95 }
                - { name: WEBRip-2160p, max: 125, preferred: 95 }
                - { name: Bluray-2160p, max: 125, preferred: 110 }
                - { name: HDTV-2160p, max: 125, preferred: 95 }
                - { name: WEBDL-1080p, max: 85, preferred: 60 }
                - { name: WEBRip-1080p, max: 85, preferred: 60 }
                - { name: Bluray-1080p, max: 85, preferred: 60 }
                - { name: HDTV-1080p, max: 85, preferred: 60 }

        quality_profiles:
            - name: FR HD-UHD
              score_set: french-multi-vf
              min_format_score: 0
              upgrade:
                  allowed: true
                  until_quality: Bluray|WEB 1080p-2160p
                  until_score: 40000
              qualities:
                  - name: Bluray|WEB 1080p-2160p
                    qualities: [Bluray-2160p, WEBRip-2160p, WEBDL-2160p, Bluray-1080p, WEBRip-1080p, WEBDL-1080p]

        custom_formats:
            - trash_ids:
                  - 4b900e171accbfb172729b63323ea8ca # MULTi
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 40000
            - trash_ids:
                  - 404c08fd0bd67f39b4d8e5709319094e # VFF
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 5000
            - trash_ids:
                  - b6ace47331a1d3b77942fc18156f6df6 # VFQ
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 2500
            - trash_ids:
                  - 9172b2f683f6223e3a1846427b417a3d # VOSTFR
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 0
            - trash_ids:
                  - 29b5f7b1a5f20f64228786c3ab1bdc7d # VF2
                  - b3fb499641d7b3c2006be1d9eb014cb3 # VFB
                  - 52772f1cad6b5d26c2551f79bc538a50 # VFI
                  - 4cafa20d5584f6ba1871d1b8941aa3cb # VOF
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 5000
            - trash_ids:
                  - 95aa50f71a01c82354a7a2b385f1c4d8 # VQ
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 2500
            - trash_ids:
                  - fr-french-generic # French Audio (generic)
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 4800
            - trash_ids:
                  - fr-2160p-bonus
              assign_scores_to:
                  - name: FR HD-UHD
                    score: 100

        custom_format_groups:
            add:
                - trash_id: 59f7ab9ff64d0026b011b985b1cc8670 # [Unwanted] Unwanted Formats French
                  assign_scores_to:
                      - name: FR HD-UHD
                - trash_id: 12a919c8a5e2342db6e9c0b4e3c0756e # [Release Groups] French
                  select_all: true
                  assign_scores_to:
                      - name: FR HD-UHD
                - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
                  assign_scores_to:
                      - name: FR HD-UHD

