                - { name: WEBDL-2160p, max: 125, preferred: 95 }
                - { name: WEBRip-2160p, max: 125, preferred: 95 }
                - { name: Bluray-2160p, max: 125, preferred: 95 }
                - { name: HDTV-2160p, max: 125, preferred: 95 }
                - { name: WEBDL-1080p, max: 85, preferred: 60 }
