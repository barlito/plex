services:
    filebrowser:
        image: filebrowser/filebrowser
        environment:
            - PUID=1000
            - PGID=1000
            - FB_NOAUTH=true
        volumes:
            - ./medias/complete:/srv
            - ./filebrowser/database.db:/database.db
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.filebrowser.loadbalancer.server.port=80

                - traefik.http.routers.filebrowser-secure.rule=Host(`filebrowser.barlito.fr`)
                - traefik.http.routers.filebrowser-secure.tls=true
                - traefik.http.routers.filebrowser-secure.entrypoints=https
                - traefik.http.routers.filebrowser-secure.tls.certresolver=letsencrypt
                - traefik.http.routers.filebrowser-secure.middlewares=authelia-auth@file,security-headers@file
        networks:
            - traefik_traefik_proxy

    # ATTENTION : `download-dir` doit valoir /downloads/incoming (et surtout pas
    # /downloads/complete/Films, qui est le root folder de Radarr). Ce réglage
    # vit dans transmission/config/settings.json, l'image n'expose aucune
    # variable d'environnement pour le piloter — voir la PR pour la procédure.
    transmission:
        image: lscr.io/linuxserver/transmission:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
            - TRANSMISSION_WEB_HOME=/config/transmission-web-control/src/
        volumes:
            - ./transmission/config:/config
            - ./transmission/watch:/watch
            - ./medias:/downloads
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.transmission.loadbalancer.server.port=9091

                - traefik.http.routers.transmission-secure.rule=Host(`transmission.barlito.fr`)
                - traefik.http.routers.transmission-secure.tls=true
                - traefik.http.routers.transmission-secure.entrypoints=https
                - traefik.http.routers.transmission-secure.tls.certresolver=letsencrypt
                - traefik.http.routers.transmission-secure.middlewares=authelia-auth@file,security-headers@file
        networks:
            - traefik_traefik_proxy

    plex:
        image: lscr.io/linuxserver/plex:latest
        hostname: KS-6 Plex New
        ports:
            - "32400:32400/tcp"
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
            - VERSION=docker
        volumes:
            - ./plex/config:/config
            - ./medias:/data
        networks:
            - traefik_traefik_proxy

    ubooquity:
        image: lscr.io/linuxserver/ubooquity:latest
        environment:
            - PUID=1000
            - PGID=1000
        volumes:
            - ./ubooquity/config:/config
            - ./medias/complete/books:/books
            - ./medias/complete/comics:/comics
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.ubooquity.loadbalancer.server.port=2202

                - traefik.http.routers.ubooquity-secure.rule=Host(`ubooquity.barlito.fr`)
                - traefik.http.routers.ubooquity-secure.service=ubooquity
                - traefik.http.routers.ubooquity-secure.tls=true
                - traefik.http.routers.ubooquity-secure.entrypoints=https
                - traefik.http.routers.ubooquity-secure.tls.certresolver=letsencrypt

                - traefik.http.services.admin-ubooquity.loadbalancer.server.port=2203

                - traefik.http.routers.admin-ubooquity-secure.rule=Host(`admin.ubooquity.barlito.fr`)
                - traefik.http.routers.admin-ubooquity-secure.service=admin-ubooquity
                - traefik.http.routers.admin-ubooquity-secure.tls=true
                - traefik.http.routers.admin-ubooquity-secure.entrypoints=https
                - traefik.http.routers.admin-ubooquity-secure.tls.certresolver=letsencrypt
        networks:
            - traefik_traefik_proxy

    # Radarr / Sonarr montent ./medias sur /downloads, comme Transmission :
    # même point de montage => hardlinks possibles entre le dossier de
    # téléchargement (/downloads/incoming) et la bibliothèque
    # (/downloads/complete/...). Import instantané, zéro duplication disque,
    # et le torrent continue de seeder.
    #
    # Transmission DOIT télécharger dans /downloads/incoming (et pas dans
    # /downloads/complete/Films) : Radarr refuse un client dont le dossier de
    # destination est aussi son root folder.
    radarr:
        image: lscr.io/linuxserver/radarr:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
        volumes:
            - ./radarr/config:/config
            - ./medias:/downloads
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.radarr.loadbalancer.server.port=7878

                - traefik.http.routers.radarr-secure.rule=Host(`radarr.barlito.fr`)
                - traefik.http.routers.radarr-secure.tls=true
                - traefik.http.routers.radarr-secure.entrypoints=https
                - traefik.http.routers.radarr-secure.tls.certresolver=letsencrypt
                - traefik.http.routers.radarr-secure.middlewares=authelia-auth@file,security-headers@file
        networks:
            - traefik_traefik_proxy

    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
        volumes:
            - ./sonarr/config:/config
            - ./medias:/downloads
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.sonarr.loadbalancer.server.port=8989

                - traefik.http.routers.sonarr-secure.rule=Host(`sonarr.barlito.fr`)
                - traefik.http.routers.sonarr-secure.tls=true
                - traefik.http.routers.sonarr-secure.entrypoints=https
                - traefik.http.routers.sonarr-secure.tls.certresolver=letsencrypt
                - traefik.http.routers.sonarr-secure.middlewares=authelia-auth@file,security-headers@file
        networks:
            - traefik_traefik_proxy

    # Prowlarr ne gère que des indexeurs : aucun accès aux médias, donc pas de
    # montage de ./medias.
    prowlarr:
        image: lscr.io/linuxserver/prowlarr:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
        volumes:
            - ./prowlarr/config:/config
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.prowlarr.loadbalancer.server.port=9696

                - traefik.http.routers.prowlarr-secure.rule=Host(`prowlarr.barlito.fr`)
                - traefik.http.routers.prowlarr-secure.tls=true
                - traefik.http.routers.prowlarr-secure.entrypoints=https
                - traefik.http.routers.prowlarr-secure.tls.certresolver=letsencrypt
                - traefik.http.routers.prowlarr-secure.middlewares=authelia-auth@file,security-headers@file
        networks:
            - traefik_traefik_proxy

    # Bazarr : récupération automatique des sous-titres (FR en priorité).
    # Il doit voir la bibliothèque avec les MÊMES chemins que Radarr/Sonarr,
    # d'où le montage identique de ./medias sur /downloads.
    bazarr:
        image: lscr.io/linuxserver/bazarr:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
        volumes:
            - ./bazarr/config:/config
            - ./medias:/downloads
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.bazarr.loadbalancer.server.port=6767

                - traefik.http.routers.bazarr-secure.rule=Host(`bazarr.barlito.fr`)
                - traefik.http.routers.bazarr-secure.tls=true
                - traefik.http.routers.bazarr-secure.entrypoints=https
                - traefik.http.routers.bazarr-secure.tls.certresolver=letsencrypt
                - traefik.http.routers.bazarr-secure.middlewares=authelia-auth@file,security-headers@file
        networks:
            - traefik_traefik_proxy

    emby:
        image: lscr.io/linuxserver/emby:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
        volumes:
            - ./emby/config:/config
            - ./medias:/downloads
        devices:
            - /dev/dri:/dev/dri
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.emby.loadbalancer.server.port=8096

                - traefik.http.routers.emby-secure.rule=Host(`emby.barlito.fr`)
                - traefik.http.routers.emby-secure.tls=true
                - traefik.http.routers.emby-secure.entrypoints=https
                - traefik.http.routers.emby-secure.tls.certresolver=letsencrypt
        networks:
            - traefik_traefik_proxy

    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Paris
            - JELLYFIN_PublishedServerUrl=https://jellyfin.barlito.fr
        volumes:
            - ./jellyfin/config:/config
            - ./medias:/downloads
        devices:
            - /dev/dri:/dev/dri
        deploy:
            labels:
                - traefik.enable=true

                - traefik.http.services.jellyfin.loadbalancer.server.port=8096

                - traefik.http.routers.jellyfin-secure.rule=Host(`jellyfin.barlito.fr`)
                - traefik.http.routers.jellyfin-secure.tls=true
                - traefik.http.routers.jellyfin-secure.entrypoints=https
                - traefik.http.routers.jellyfin-secure.tls.certresolver=letsencrypt
        networks:
            - traefik_traefik_proxy

networks:
    traefik_traefik_proxy:
        external: true
